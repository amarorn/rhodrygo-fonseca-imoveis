<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 682" width="100%" height="100%">
  <defs>
    <linearGradient id="shine-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <image
    id="anim-logo-image"
    href="logo-rhodrygo-fonseca-transparent.png"
    x="0"
    y="0"
    width="1024"
    height="682"
    preserveAspectRatio="xMidYMid meet"
  />

  <rect id="anim-shine" x="-400" y="0" width="400" height="682" fill="url(#shine-gradient)" opacity="0">
    <animate attributeName="x" values="-400;1200;-400" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
